<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1 Year Anniversary 💙</title>

<style>
/* ===== หน้าพิเศษก่อนเข้า ===== */
.screen{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:1000;
  transition:.8s;
}
.hidden{opacity:0;pointer-events:none}

/* หน้าเปิด */
#startScreen{
  background:linear-gradient(135deg,#ffb3d9,#c7a4ff);
}
#startScreen button{
  padding:20px 60px;
  font-size:22px;
  border:none;
  border-radius:40px;
  cursor:pointer;
}

/* หลอดหัวใจ */
#heartScreen{
  background:linear-gradient(135deg,#f5d6ff,#e6ccff);
}
.heart-tube{
  width:180px;
  height:260px;
  border:6px solid #a45cff;
  border-radius:90px 90px 40px 40px;
  overflow:hidden;
  position:relative;
}
.heart-fill{
  position:absolute;
  bottom:0;
  width:100%;
  height:0%;
  background:linear-gradient(#ff8fd8,#a45cff);
  transition:.3s;
}

/* ใส่รหัส */
#codeScreen{
  background:#f1e6ff;
}
#codeScreen input{
  font-size:20px;
  padding:10px;
  margin:10px;
  text-align:center;
}

/* พลุ */
#fireworkScreen{
  background:black;
  color:white;
  font-size:24px;
}

/* ====== โค้ดเดิมของคุณ (ไม่แก้) ====== */
:root{
  --bg1:#eef4ff;
  --bg2:#dbe8ff;
  --bg3:#e3dcff;
  --deep:#4f5b82;
}
*{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
  overflow:hidden;
}
.glow{
  position:fixed;width:520px;height:520px;
  background:radial-gradient(circle,rgba(160,190,255,.65),transparent 70%);
  filter:blur(90px);animation:move 26s infinite alternate ease-in-out;z-index:0;
}
.g1{top:-220px;left:-200px}
.g2{bottom:-240px;right:-200px;animation-delay:6s}
@keyframes move{to{transform:translateY(160px)}}
.bg{position:fixed;inset:0;pointer-events:none;z-index:1}
.float-img{position:absolute;bottom:-80px;width:30px;height:30px;border-radius:50%;opacity:.85;animation:rise linear forwards}
.floating{position:absolute;bottom:-60px;font-size:18px;animation:rise linear forwards;opacity:.7}
@keyframes rise{
  from{transform:translateY(0) scale(.9);opacity:0}
  20%{opacity:1}
  to{transform:translateY(-120vh) scale(1.15);opacity:0}
}
#intro{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#9fc4ff,#b19cff);
  z-index:50;transition:1.2s ease
}
.intro-card{
  background:rgba(255,255,255,.25);
  backdrop-filter:blur(28px);
  padding:90px 60px;border-radius:60px;text-align:center;color:#fff;
}
.intro-card button{
  margin-top:46px;padding:20px 70px;border:none;border-radius:50px;
  font-size:18px;cursor:pointer
}
.main{position:relative;z-index:10;min-height:100vh;display:flex;align-items:center;justify-content:center;opacity:0;transition:1.2s}
.main.show{opacity:1}
</style>
</head>

<body>

<!-- หน้าใหม่ -->
<div id="startScreen" class="screen">
  <h1>เปิดสิ 💜</h1>
  <button onclick="goHeart()">เปิด</button>
</div>

<div id="heartScreen" class="screen hidden" onclick="fillHeart()">
  <div class="heart-tube">
    <div class="heart-fill" id="heartFill"></div>
  </div>
  <p>แตะหน้าจอ 💜</p>
</div>

<div id="codeScreen" class="screen hidden">
  <input id="codeInput" placeholder="ใส่รหัส">
  <button onclick="checkCode()">ยืนยัน</button>
</div>

<div id="fireworkScreen" class="screen hidden">
  🎆🎆🎆
</div>

<!-- โค้ดเดิม -->
<div class="glow g1"></div>
<div class="glow g2"></div>
<div class="bg" id="bg"></div>

<div id="intro">
  <div class="intro-card">
    <h1>สำหรับน้องโอปอนะจ๊ะ 💙</h1>
    <button onclick="enter()">✨ เปิดสิ</button>
  </div>
</div>

<div class="main" id="main"></div>

<script>
let heart=0;
function goHeart(){
  startScreen.classList.add("hidden");
  heartScreen.classList.remove("hidden");
}
function fillHeart(){
  if(heart>=100)return;
  heart+=10;
  heartFill.style.height=heart+"%";
  if(heart>=100){
    setTimeout(()=>{
      heartScreen.classList.add("hidden");
      codeScreen.classList.remove("hidden");
    },500);
  }
}
function checkCode(){
  if(codeInput.value==="080225"){
    codeScreen.classList.add("hidden");
    fireworkScreen.classList.remove("hidden");
    setTimeout(()=>{
      fireworkScreen.classList.add("hidden");
    },3000);
  }
}
</script>

</body>
</html>
